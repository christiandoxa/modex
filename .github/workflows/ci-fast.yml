name: Fast CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modex-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.build-artifact.outputs.source_sha }}
      run_id: ${{ steps.build-artifact.outputs.run_id }}
      run_attempt: ${{ steps.build-artifact.outputs.run_attempt }}
      manifest_sha256: ${{ steps.build-artifact.outputs.manifest_sha256 }}
      bundle_sha256: ${{ steps.build-artifact.outputs.bundle_sha256 }}
    env:
      MODEX_CI_PYTHON_VERSION: '3.14.10'
    steps:
      - name: Set up the Ubuntu sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
      - name: Run fast CI
        env:
          MODEX_CI_ARTIFACT_PRODUCER: '1'
          MODEX_CI_FAST_HELPER_TESTS_IN_SHARDS: '1'
        run: |
          set -o pipefail
          export MODEX_TOOLCHAIN_DIR="$RUNNER_TEMP/modex-mojo-$GITHUB_RUN_ID"
          export CI_EVIDENCE_DIR="$RUNNER_TEMP/modex-ci-evidence"
          mkdir -p "$CI_EVIDENCE_DIR"
          make ci-fast 2>&1 | tee "$CI_EVIDENCE_DIR/ci-fast.log"
      - name: Package the verified Modex executable
        id: build-artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          MODEX_TOOLCHAIN_DIR: ${{ runner.temp }}/modex-mojo-${{ github.run_id }}
          PYTHON: python3
        run: |
          set -euo pipefail
          "$PYTHON" scripts/ci/check-build-inputs.py
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "$EXPECTED_SOURCE_SHA" ]] || {
            echo 'checked out source does not match the workflow commit' >&2
            exit 1
          }
          [[ -f build/modex && ! -L build/modex && -x build/modex ]] || {
            echo 'fast CI did not produce a regular executable build/modex' >&2
            exit 1
          }
          artifact_root="$RUNNER_TEMP/modex-build-handoff"
          mkdir -m 700 "$artifact_root"
          install -m 755 -- build/modex "$artifact_root/modex"
          stdlib_root=
          shopt -s nullglob
          for candidate in "$MODEX_TOOLCHAIN_DIR"/lib/python*/site-packages; do
            if [[ -d "$candidate/modular" && -d "$candidate/mojo" ]]; then
              [[ -z "$stdlib_root" ]] || {
                echo 'multiple Mojo standard-library roots found' >&2
                exit 1
              }
              stdlib_root="$candidate"
            fi
          done
          [[ -n "$stdlib_root" ]] || {
            echo 'cannot identify the pinned Mojo standard-library roots' >&2
            exit 1
          }
          compiler="$MODEX_TOOLCHAIN_DIR/bin/mojo"
          runtime="$(realpath -e -- "$MODEX_TOOLCHAIN_DIR/bin/python")"
          manifest_sha256="$("$PYTHON" scripts/ci/artifact-manifest.py create \
            --root "$artifact_root" --manifest manifest.json --file modex \
            --source-commit "$source_sha" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --producer-job linux-x86_64 \
            --target x86_64-linux-gnu --target-cpu x86-64-v3 \
            --build-flag=-O3 --build-flag=--target-cpu=x86-64-v3 \
            --build-flag=-I --build-flag=src --build-flag=src/main.mojo \
            --build-flag=-o --build-flag=build/modex \
            --compiler "$compiler" --expected-compiler-version "$("$compiler" --version)" \
            --runtime "$runtime" --expected-runtime-version "$("$MODEX_TOOLCHAIN_DIR/bin/python" --version 2>&1)" \
            --stdlib-version 1.2.0 --stdlib "modular=$stdlib_root/modular" \
            --stdlib "mojo=$stdlib_root/mojo")"
          bundle="$RUNNER_TEMP/modex-build-handoff.tar"
          tar --create --file "$bundle" --directory "$artifact_root" manifest.json modex
          bundle_sha256="$(sha256sum "$bundle" | cut -d ' ' -f1)"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'manifest_sha256=%s\n' "$manifest_sha256"
            printf 'bundle_sha256=%s\n' "$bundle_sha256"
          } >>"$GITHUB_OUTPUT"
      - name: Upload the Modex build handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fast-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/modex-build-handoff.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fast-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/modex-ci-evidence
          if-no-files-found: warn
          retention-days: 14

  ci-helper-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify clean workflow checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          [[ "$checkout_sha" == "$EXPECTED_SOURCE_SHA" ]] || {
            echo 'helper checkout does not match the workflow commit' >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo 'helper checkout is not clean' >&2
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
      - name: Run deterministic CI helper shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          "$PYTHON" scripts/ci/run-unittest.py \
            --shard-index "$SHARD_INDEX" --shard-count 2 \
            test_ci_artifact_manifest.py test_ci_private_scratch.py test_ci_shard_runner.py test_ci_test_census.py test_ci_workflow_shards.py

  artifact-consumer:
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODEX_CI_PYTHON_VERSION: '3.14.10'
      PYTHON: python3
    steps:
      - name: Set up the Ubuntu sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.linux-x86_64.outputs.source_sha }}
          persist-credentials: false
      - name: Check out the producer's source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.linux-x86_64.outputs.source_sha }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$EXPECTED_SOURCE_SHA" && "$checked_out_sha" == "$EVENT_SOURCE_SHA" ]] || {
            echo 'consumer checkout does not match the producer and workflow commit' >&2
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
      - name: Bootstrap the pinned Mojo toolchain
        env:
          MODEX_TOOLCHAIN_DIR: ${{ runner.temp }}/modex-mojo-${{ github.run_id }}
        run: make ci-bootstrap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fast-build-${{ needs.linux-x86_64.outputs.run_id }}-${{ needs.linux-x86_64.outputs.run_attempt }}
          path: ${{ runner.temp }}/modex-build-download
      - name: Verify the successful producer handoff
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.linux-x86_64.outputs.source_sha }}
          EXPECTED_RUN_ID: ${{ needs.linux-x86_64.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.linux-x86_64.outputs.run_attempt }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.linux-x86_64.outputs.manifest_sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.linux-x86_64.outputs.bundle_sha256 }}
          MODEX_TOOLCHAIN_DIR: ${{ runner.temp }}/modex-mojo-${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" == "$EXPECTED_RUN_ID" ]] || {
            echo 'consumer workflow run does not match the artifact producer' >&2
            exit 1
          }
          artifact_root="$RUNNER_TEMP/modex-build-extracted"
          mkdir -m 700 "$artifact_root"
          "$PYTHON" scripts/ci/artifact-manifest.py extract \
            --bundle "$RUNNER_TEMP/modex-build-download/modex-build-handoff.tar" \
            --destination "$artifact_root" \
            --expected-bundle-sha256 "$EXPECTED_BUNDLE_SHA256"
          stdlib_root=
          shopt -s nullglob
          for candidate in "$MODEX_TOOLCHAIN_DIR"/lib/python*/site-packages; do
            if [[ -d "$candidate/modular" && -d "$candidate/mojo" ]]; then
              [[ -z "$stdlib_root" ]] || {
                echo 'multiple Mojo standard-library roots found' >&2
                exit 1
              }
              stdlib_root="$candidate"
            fi
          done
          [[ -n "$stdlib_root" ]] || {
            echo 'cannot identify the pinned Mojo standard-library roots' >&2
            exit 1
          }
          compiler="$MODEX_TOOLCHAIN_DIR/bin/mojo"
          runtime="$(realpath -e -- "$MODEX_TOOLCHAIN_DIR/bin/python")"
          "$PYTHON" scripts/ci/artifact-manifest.py verify \
            --root "$artifact_root" --manifest manifest.json --file modex \
            --source-commit "$EXPECTED_SOURCE_SHA" --run-id "$EXPECTED_RUN_ID" \
            --run-attempt "$EXPECTED_RUN_ATTEMPT" --producer-job linux-x86_64 \
            --target x86_64-linux-gnu --target-cpu x86-64-v3 \
            --build-flag=-O3 --build-flag=--target-cpu=x86-64-v3 \
            --build-flag=-I --build-flag=src --build-flag=src/main.mojo \
            --build-flag=-o --build-flag=build/modex \
            --compiler "$compiler" --expected-compiler-version "$("$compiler" --version)" \
            --runtime "$runtime" --expected-runtime-version "$("$MODEX_TOOLCHAIN_DIR/bin/python" --version 2>&1)" \
            --stdlib-version 1.2.0 --stdlib "modular=$stdlib_root/modular" \
            --stdlib "mojo=$stdlib_root/mojo" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
          [[ -x "$artifact_root/modex" ]]
          [[ "$("$artifact_root/modex" --version)" == 'modex 0.1.0-dev' ]]
