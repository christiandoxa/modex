name: Fast CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modex-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODEX_CI_PYTHON_VERSION: '3.14.10'
    steps:
      - name: Set up the Ubuntu sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
      - name: Run fast CI
        run: |
          set -o pipefail
          export MODEX_TOOLCHAIN_DIR="$RUNNER_TEMP/modex-mojo-$GITHUB_RUN_ID"
          export CI_EVIDENCE_DIR="$RUNNER_TEMP/modex-ci-evidence"
          mkdir -p "$CI_EVIDENCE_DIR"
          make ci-fast 2>&1 | tee "$CI_EVIDENCE_DIR/ci-fast.log"
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fast-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/modex-ci-evidence
          if-no-files-found: warn
          retention-days: 14
