name: Full CI

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable Modex source commit to verify (blank uses this event commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: modex-full-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODEX_CI_PYTHON_VERSION: '3.14.10'
    steps:
      - name: Validate immutable source commit
        id: source
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="${REQUESTED_SOURCE_SHA:-$EVENT_SOURCE_SHA}"
          if [[ ! "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character Git commit SHA' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Set up the Ubuntu sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
      - name: Run full CI
        run: |
          set -o pipefail
          export MODEX_TOOLCHAIN_DIR="$RUNNER_TEMP/modex-mojo-$GITHUB_RUN_ID"
          export CI_EVIDENCE_DIR="$RUNNER_TEMP/modex-ci-evidence"
          mkdir -p "$CI_EVIDENCE_DIR"
          make ci-full 2>&1 | tee "$CI_EVIDENCE_DIR/ci-full.log"
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: full-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/modex-ci-evidence
            test-results/text-memory/width-rss.json
          if-no-files-found: warn
          retention-days: 30
